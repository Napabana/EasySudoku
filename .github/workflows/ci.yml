name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend and solver tests
        run: |
          python test_phase1.py
          python test_phase2.py
          python test_phase3.py
          python test_demo.py
          python test_api.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run type-check

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start application
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/easysudoku-uvicorn.log 2>&1 &
          for attempt in {1..30}; do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=1)"; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/easysudoku-uvicorn.log
          exit 1

      - name: Run Playwright end-to-end tests
        working-directory: frontend
        env:
          EASYSUDOKU_BASE_URL: http://127.0.0.1:8000
        run: npm run test:smoke

      - name: Build production image
        run: docker build --build-arg GIT_COMMIT="$GITHUB_SHA" -t easysudoku:ci .

      - name: Run production container
        run: |
          docker run -d --name easysudoku-ci -p 8001:8000 easysudoku:ci

      - name: Verify container health
        run: |
          for attempt in {1..30}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' easysudoku-ci 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              curl --fail http://127.0.0.1:8001/health
              curl --fail http://127.0.0.1:8001/
              exit 0
            fi

            if [ "$status" = "unhealthy" ]; then
              docker logs easysudoku-ci
              exit 1
            fi

            sleep 2
          done

          docker logs easysudoku-ci
          exit 1

      - name: Stop production container
        if: always()
        run: docker rm -f easysudoku-ci || true
